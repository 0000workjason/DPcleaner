[build-system]
requires = ["setuptools>=78.1.1"]  # >=78.1.1 fixes CVE-2025-47273 (PackageIndex path traversal)
build-backend = "setuptools.build_meta"

[project]
name = "dpcleaner"
version = "0.2.0"
description = "Near-duplicate illustration finder (SSCD embeddings) for Pixiv/Twitter art"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["dpcleaner"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Stated explicitly rather than inherited. ruff 0.16 expanded its default from
# {E, F} to 37 rule families, so an unpinned `ruff>=0.9` in requirements.txt
# turned CI red on files nobody had touched. These four are ruff's classic
# default and what this codebase was written against; widening the set is a
# deliberate decision, not something a linter release should make for us.
select = ["E4", "E7", "E9", "F"]
