[build-system]
requires = ["setuptools>=78.1.1"]  # >=78.1.1 fixes CVE-2025-47273 (PackageIndex path traversal)
build-backend = "setuptools.build_meta"

[project]
name = "dpcleaner"
version = "0.2.0"
description = "Near-duplicate illustration finder (SSCD embeddings) for Pixiv/Twitter art"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["dpcleaner"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Rule selection is ruff's own default, which 0.16 widened well beyond the old
# {E, F}. We take that wider set deliberately -- but it only stays predictable
# because requirements.txt pins the ruff version. Do not un-pin it: an
# unpinned linter turned CI red once already, on files nobody had touched.
#
# Listing the families here instead would be worse, not better: selecting a
# prefix like "D" or "PTH" enables the whole family rather than the curated
# subset ruff enables by default (473 findings versus 26 on this codebase).
