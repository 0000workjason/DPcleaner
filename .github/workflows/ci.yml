name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest backend/tests

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Placeholder sidecar binary (externalBin requires the file to exist)
        # NOT `New-Item -Force`: that truncates an existing file. Harmless in
        # CI (fresh checkout), but anyone running this line locally would zero
        # their real 175 MB sidecar, and `tauri build` would then happily ship
        # an installer containing a 0-byte backend without any stage failing.
        run: |
          $p = 'binaries/dpcleaner-server-x86_64-pc-windows-msvc.exe'
          New-Item -ItemType Directory -Path binaries -Force | Out-Null
          if (-not (Test-Path $p)) { New-Item -ItemType File -Path $p | Out-Null }
      - run: cargo check
      - run: cargo clippy -- -D warnings
